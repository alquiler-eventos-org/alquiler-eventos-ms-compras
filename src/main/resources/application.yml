spring:
  application:
    # Nombre con el que se registra en Eureka (debe coincidir con la ruta lb://
    # del API Gateway). Todo configurable, nada quemado en codigo.
    name: ${APP_NAME:ms-compras}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Pool de conexiones Hikari (aca lo recomendo Claude para Supabase):
    # con pgbouncer/transact pooler, pocas conexiones por instancia evitan
    # saturar el pool del free tier cuando ambos microservicios corren juntos.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  jpa:
    hibernate:
      # Liquibase es el UNICO que modifica la BD; Hibernate solo valida.
      ddl-auto: validate
    open-in-view: false
  liquibase:
    # El changelog vive DENTRO del JAR common (no se duplica aca).
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Liquibase deshabilitado aca: las tablas ya se crean en ms-alquiler.
    enabled: false
  cache:
    type: ${CACHE_TYPE:redis}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: ${API_CONTEXT_PATH:/api}

# ---------- Registro en Eureka (descubrimiento dinamico) ----------
eureka:
  client:
    # Se puede desactivar con EUREKA_ENABLED=false para correr sin Eureka
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    # false = se registra con el hostname (responde bien en local).
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    # Heartbeats acelerados para demos: una instancia caida desaparece rapido
    lease-renewal-interval-in-seconds: ${EUREKA_RENEWAL_INTERVAL:5}
    lease-expiration-duration-in-seconds: ${EUREKA_EXPIRATION:15}

# Valores por defecto de paginacion (todo configurable, nada quemado en codigo).
app:
  pagination:
    default-page: ${DEFAULT_PAGE:0}
    default-page-size: ${DEFAULT_PAGE_SIZE:10}
  # Metadatos de OpenAPI: permiten que el "Try it out" del Swagger pegue contra
  # el API Gateway (http://localhost:8080/api) en vez de al microservicio
  # directo. Si no se define, queda con su propia URL (modo standalone).
  openapi:
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8082/api}
    title: ${OPENAPI_TITLE:MS Compras - Proveedores y Ordenes de Compra}
    description: ${OPENAPI_DESCRIPTION:Microservicio de compras (entrega 3, con JWT y cache Redis) del sistema de alquiler de equipos para eventos}
  cache:
    enabled: ${CACHE_ENABLED:true}
    key-prefix: ${CACHE_KEY_PREFIX:ae}
    environment: ${CACHE_ENVIRONMENT:local}
    key-version: ${CACHE_KEY_VERSION:v1}
    domains:
      proveedores:
        name: ${CACHE_PROVEEDORES_NAME:compras:proveedores}
        key-type: ${CACHE_PROVEEDORES_KEY_TYPE:proveedor}
        ttl-seconds: ${CACHE_PROVEEDORES_TTL_SECONDS:1800}
      ordenes-compra:
        name: ${CACHE_ORDENES_COMPRA_NAME:compras:ordenes-compra}
        key-type: ${CACHE_ORDENES_COMPRA_KEY_TYPE:orden-compra}
        ttl-seconds: ${CACHE_ORDENES_COMPRA_TTL_SECONDS:120}
  security:
    jwt:
      secret: ${SECURITY_JWT_SECRET:}
      issuer: ${SECURITY_JWT_ISSUER:alquiler-eventos-seguridad}
      algorithm: ${SECURITY_JWT_ALGORITHM:HS256}

logging:
  config: ${LOGGING_CONFIG:classpath:logback-spring.xml}
  level:
    com.alquilereventos.compras: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    com.alquilereventos.compras.config.cache: ${LOG_LEVEL_CACHE:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
